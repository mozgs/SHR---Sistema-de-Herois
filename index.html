<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHR — Super Hero RPG</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070b09;
            --bg-card: #101814;
            --bg-input: #16221c;
            --primary: #00ff88;
            --primary-glow: rgba(0, 255, 136, 0.25);
            --accent: #00e5ff;
            --danger: #ff3366;
            --text-light: #f1f5f9;
            --text-muted: #7e9488;
            --border: #1f3329;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-dark); color: var(--text-light); min-height: 100vh; display: flex; flex-direction: column; }

        header {
            background: linear-gradient(180deg, #030504 0%, var(--bg-card) 100%);
            border-bottom: 2px solid var(--primary);
            padding: 1.2rem 1rem;
            text-align: center;
            box-shadow: 0 4px 20px var(--primary-glow);
        }

        header h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 2.6rem;
            color: var(--primary);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .mode-switch {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 1rem;
        }

        .btn-mode {
            background: var(--bg-input);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 8px 22px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-mode.active {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .container { max-width: 1000px; margin: 1.5rem auto; padding: 0 1rem; flex: 1; width: 100%; }

        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeIn 0.25s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Nav Abas Jogador */
        .tabs-bar {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            margin-bottom: 1.5rem;
            padding-bottom: 4px;
        }

        .tab-item {
            background: var(--bg-card);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
        }

        .tab-item.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            font-weight: 700;
        }

        .panel-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        h2.title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.7rem;
            color: var(--primary);
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.4rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .full { grid-column: 1 / -1; }

        label { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        input, select, textarea {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-light);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); }
        textarea { resize: vertical; min-height: 85px; }

        .btn {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
        }
        .btn:hover { background: #00cc6d; box-shadow: 0 0 10px var(--primary-glow); }
        .btn-sec { background: transparent; border: 1px solid var(--border); color: var(--text-light); }
        .btn-sec:hover { background: var(--bg-input); }
        .btn-danger { background: rgba(255, 51, 102, 0.15); color: var(--danger); border: 1px solid var(--danger); }
        .btn-danger:hover { background: var(--danger); color: #fff; }

        /* Barras de Status */
        .bars-container { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }
        .meter-bg { background: #050806; height: 12px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); margin-top: 6px; }
        .meter-fill { height: 100%; transition: width 0.3s; }
        .pv-fill { background: var(--danger); }
        .pe-fill { background: var(--accent); }

        /* Tabela de Perícias */
        table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.88rem; }
        th { color: var(--text-muted); }

        /* Cards de Poderes */
        .power-card {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.8rem;
        }
        .power-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem; }
        .badge-toggle {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid;
        }
        .badge-toggle.off { background: transparent; color: var(--text-muted); border-color: var(--border); }
        .badge-toggle.on { background: rgba(0, 255, 136, 0.2); color: var(--primary); border-color: var(--primary); }

        footer { text-align: center; padding: 1.5rem; color: var(--text-muted); font-size: 0.85rem; border-top: 1px solid var(--border); background: var(--bg-card); }
    </style>
</head>
<body>

    <header>
        <h1>S.H.R. — Super Hero RPG</h1>
        <div class="mode-switch">
            <button class="btn-mode active" onclick="setModo('jogador')">🎮 Modo Jogador</button>
            <button class="btn-mode" onclick="setModo('mestre')">🎲 Modo Mestre</button>
        </div>
    </header>

    <div class="container">

        <!-- ================= MODO JOGADOR ================= -->
        <div class="view-section active" id="view-jogador">
            <div style="display:flex; justify-content:flex-end; gap:8px; margin-bottom:1rem;">
                <button class="btn btn-sec" onclick="exportarJSON()">Exportar Ficha (.JSON)</button>
                <button class="btn btn-sec" onclick="document.getElementById('fileIn').click()">Importar JSON</button>
                <input type="file" id="fileIn" style="display:none" onchange="importarJSON(event)">
            </div>

            <div class="tabs-bar">
                <button class="tab-item active" onclick="setAba(0)">1. Identidade</button>
                <button class="tab-item" onclick="setAba(1)">2. Atributos</button>
                <button class="tab-item" onclick="setAba(2)">3. Perícias</button>
                <button class="tab-item" onclick="setAba(3)">4. Poderes</button>
                <button class="tab-item" onclick="setAba(4)">5. Status & Inventário</button>
                <button class="tab-item" onclick="setAba(5)">6. Resumo</button>
            </div>

            <!-- Aba 1: Identidade -->
            <div class="panel-card aba-content" id="aba-0">
                <h2 class="title">Identidade do Herói</h2>
                <div class="form-grid">
                    <div class="form-group"><label>Nome do Personagem</label><input type="text" id="nome" placeholder="Ex: Capitão Vórtex" oninput="salvar()"></div>
                    <div class="form-group"><label>Nome do Jogador</label><input type="text" id="jogador" placeholder="Seu nome" oninput="salvar()"></div>
                    <div class="form-group"><label>Idade</label><input type="number" id="idade" placeholder="Ex: 24" oninput="salvar()"></div>
                    <div class="form-group"><label>Origem</label><input type="text" id="origem" placeholder="Ex: Experimento Genético" oninput="salvar()"></div>
                    <div class="form-group full"><label>Conceito</label><input type="text" id="conceito" placeholder="Ex: Velocista vigilante das ruas" oninput="salvar()"></div>
                    <div class="form-group full"><label>História</label><textarea id="historia" placeholder="Descreva o passado do personagem..." oninput="salvar()"></textarea></div>
                </div>
            </div>

            <!-- Aba 2: Atributos -->
            <div class="panel-card aba-content" id="aba-1" style="display:none;">
                <h2 class="title">Atributos Principais</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Corpo (Base)</label>
                        <input type="number" id="cBase" value="2" min="1" max="10" oninput="salvar(); reCalc();">
                        <span style="font-size:0.85rem; color:var(--primary); font-weight:bold; margin-top:4px;">Total Final: <span id="cTotal">2</span></span>
                    </div>
                    <div class="form-group">
                        <label>Mente (Base)</label>
                        <input type="number" id="mBase" value="2" min="1" max="10" oninput="salvar(); reCalc();">
                        <span style="font-size:0.85rem; color:var(--primary); font-weight:bold; margin-top:4px;">Total Final: <span id="mTotal">2</span></span>
                    </div>
                    <div class="form-group">
                        <label>Percepção (Base)</label>
                        <input type="number" id="pBase" value="2" min="1" max="10" oninput="salvar(); reCalc();">
                        <span style="font-size:0.85rem; color:var(--primary); font-weight:bold; margin-top:4px;">Total Final: <span id="pTotal">2</span></span>
                    </div>
                </div>
            </div>

            <!-- Aba 3: Perícias -->
            <div class="panel-card aba-content" id="aba-2" style="display:none;">
                <h2 class="title">Perícias <button class="btn" style="font-size:0.75rem;" onclick="addPericia()">+ Nova Perícia</button></h2>
                <div style="overflow-x:auto;">
                    <table>
                        <thead>
                            <tr><th>Perícia</th><th>Atributo Base</th><th>Treinamento</th><th>Bônus Itens/Outros</th><th>Total Final</th></tr>
                        </thead>
                        <tbody id="tblPericias"></tbody>
                    </table>
                </div>
            </div>

            <!-- Aba 4: Poderes -->
            <div class="panel-card aba-content" id="aba-3" style="display:none;">
                <h2 class="title">Poderes & Habilidades <button class="btn" style="font-size:0.75rem;" onclick="addPoder()">+ Novo Poder
